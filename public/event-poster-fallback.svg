<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">BUILD THE FUTURE HACKATHON 2026</title>
  <desc id="desc">Fallback event poster showing the confirmed date, format, fee, and payment deadline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061024"/><stop offset="1" stop-color="#070815"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2784ff"/><stop offset=".52" stop-color="#29d8ff"/><stop offset="1" stop-color="#8b55ff"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#2b6bb5" stroke-opacity=".15"/></pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/><rect width="900" height="1200" fill="url(#grid)"/>
  <circle cx="740" cy="180" r="250" fill="#155cff" opacity=".12"/><circle cx="130" cy="930" r="310" fill="#784cff" opacity=".08"/>
  <text x="70" y="95" fill="#82cfff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">ANNUAL HACKATHON PLUS EVENT</text>
  <text x="70" y="190" fill="#f8fbff" font-family="Arial,sans-serif" font-size="70" font-weight="900">BUILD THE</text>
  <text x="70" y="275" fill="url(#accent)" font-family="Arial,sans-serif" font-size="92" font-weight="900">FUTURE</text>
  <text x="70" y="350" fill="#f8fbff" font-family="Arial,sans-serif" font-size="67" font-weight="900">HACKATHON</text>
  <text x="70" y="410" fill="#b7c8e5" font-family="Arial,sans-serif" font-size="24">Innovate. Collaborate. Build what's next.</text>
  <rect x="70" y="480" width="760" height="170" rx="24" fill="#0e192b" stroke="#3f8cff" stroke-opacity=".35"/>
  <text x="105" y="535" fill="#6edfff" font-family="Arial,sans-serif" font-size="18" font-weight="700">1 NOVEMBER 2026</text>
  <text x="105" y="585" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="800">36-HOUR HACKATHON</text>
  <text x="105" y="625" fill="#aebcd3" font-family="Arial,sans-serif" font-size="20">Industry expert lectures · Networking opportunities</text>
  <g transform="translate(70 710)">
    <rect width="235" height="190" rx="20" fill="#0d1727" stroke="#ffffff" stroke-opacity=".08"/><text x="28" y="48" fill="#8fcfff" font-family="Arial,sans-serif" font-size="15">TEAM SIZE</text><text x="28" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="800">2–6 MEMBERS</text><text x="28" y="140" fill="#9caac0" font-family="Arial,sans-serif" font-size="17">One team lead</text>
    <rect x="260" width="235" height="190" rx="20" fill="#0d1727" stroke="#ffffff" stroke-opacity=".08"/><text x="288" y="48" fill="#c08aff" font-family="Arial,sans-serif" font-size="15">FEE</text><text x="288" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="800">₹4,500</text><text x="288" y="140" fill="#9caac0" font-family="Arial,sans-serif" font-size="17">Per participant</text>
    <rect x="520" width="240" height="190" rx="20" fill="#0d1727" stroke="#ffffff" stroke-opacity=".08"/><text x="548" y="48" fill="#63eab0" font-family="Arial,sans-serif" font-size="15">PAYMENT DEADLINE</text><text x="548" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="800">2 OCT 2026</text><text x="548" y="140" fill="#9caac0" font-family="Arial,sans-serif" font-size="17">College GDG teams</text>
  </g>
  <text x="70" y="985" fill="#ffd26d" font-family="Arial,sans-serif" font-size="22" font-weight="700">COLLEGE STUDENTS ONLY</text>
  <text x="70" y="1055" fill="#f6f8ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Jointly hosted by</text>
  <text x="70" y="1100" fill="#b8c7dc" font-family="Arial,sans-serif" font-size="24">GitHub · GDG India · Google Cloud</text>
  <text x="70" y="1150" fill="#7e8ca3" font-family="Arial,sans-serif" font-size="17">Contact your respective college GDG team lead for payment and more details.</text>
</svg>
